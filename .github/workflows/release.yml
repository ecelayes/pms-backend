name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod download
        shell: bash

      - name: Run tests
        run: go test -race -timeout 60s ./...
        shell: bash

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/pms-backend-linux-amd64 ./cmd/api
          GOOS=linux GOARCH=arm64 go build -o dist/pms-backend-linux-arm64 ./cmd/api
          GOOS=darwin GOARCH=amd64 go build -o dist/pms-backend-darwin-amd64 ./cmd/api
          GOOS=darwin GOARCH=arm64 go build -o dist/pms-backend-darwin-arm64 ./cmd/api
        shell: bash

      - name: Build migration tool
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/migrate-linux-amd64 ./cmd/migrate
        shell: bash

      - name: Generate changelog excerpt
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREV}..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" -n 50)
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.changelog.outputs.VERSION }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.NOTES }}
          files: |
            dist/pms-backend-*
            dist/migrate-*
          draft: true
